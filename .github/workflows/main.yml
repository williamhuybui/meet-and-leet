name: Enforce dev as source for main

on:
  pull_request:
    branches:
      - main

jobs:
  enforce-dev-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR source is dev
        run: |
          echo "PR source branch: ${{ github.head_ref }}"
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "❌ PRs to main must come from 'dev' branch only."
            exit 1
          fi
          echo "✅ Valid: PR from dev → main."
